name = "oris-finance"
compatibility_date = "2026-08-24"

# Preview hostname on a domain the repo owner already controls on this Cloudflare account —
# NOT oris-finance.com (BUILD-PLAN.md §8, WP7: "Deploy to a preview URL, not the live domain.
# WordPress stays up until the boss approves."). `custom_domain = true` has Cloudflare provision
# the DNS record + SSL for this hostname automatically on deploy, since pkfalumni.com's zone is
# already on this account. Swap this for an oris-finance.com route only once that approval
# happens; until then the auto-assigned <name>.<subdomain>.workers.dev URL still also works.
# Must stay above [assets] — a bare key after a [table] header belongs to that table in TOML,
# so this was silently swallowed as an unrecognised `assets.routes` field before this reorder.
routes = [
  { pattern = "oris-finance.pkfalumni.com", custom_domain = true },
]

# REMEDIATION-PLAN.md PR3 (BUILD-PLAN.md §8 WP6): the site was static-assets-only with no Worker
# script, so the two forms in src/pages/contacts/ and src/pages/ouvrir-un-compte/ posted to
# /api/contact and /api/ouvrir-un-compte, neither of which existed — a hard 404 on every
# submission. worker/index.ts now fronts the asset bundle: it handles those two POST routes
# itself and falls through to `env.ASSETS.fetch()` for everything else, so every static route
# still serves exactly as before.
main = "worker/index.ts"

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# By default the Assets Worker serves any request that matches a file in `directory` *without*
# ever invoking `main` — which would make /contacts/ and /ouvrir-un-compte/ unreachable by our
# Worker even though it needs to run on GET there too, to set the submission-timing cookie the
# honeypot+timing anti-spam baseline reads back on POST (see worker/lib/antispam.ts). /api/* is
# listed too for clarity, though it would reach the Worker by default anyway since no static file
# ever matches it.
run_worker_first = ["/api/*", "/contacts/", "/ouvrir-un-compte/"]

# --- Form delivery (REMEDIATION-PLAN.md PR3, blocked on D1) --------------------------------
# worker/lib/mail.ts reads env.MAIL_DELIVERY, a single named binding the delivery mechanism is
# deliberately abstracted behind. D1 (README.md "Secrets") — destination email vs. a
# transactional-email provider + API key — is not yet answered, so nothing is bound here. Until
# it is, submissions are validated, anti-spam-checked, and logged via a fallback no-op delivery
# (worker/lib/mail.ts) rather than actually sent anywhere. Once D1 lands, wire ONE of:
#
#   # Option A — Cloudflare Email Routing (send_email binding), if the destination is a plain
#   # inbox rather than a transactional-email provider. Needs a destination address verified in
#   # the dashboard first (Email Routing → Destination addresses).
#   # [[send_email]]
#   # name = "MAIL_DELIVERY"
#   # destination_address = "<verified-destination>@oris-finance.com"
#
#   # Option B — a transactional provider (Resend/Postmark/etc.) called over HTTPS from
#   # worker/lib/mail.ts using an API key. No binding needed in that case — just:
#   #   wrangler secret put MAIL_PROVIDER_API_KEY
#   # and implement a MailDelivery that calls the provider's REST API with it.
#
# TURNSTILE_SECRET (also D1) is read the same way — set with `wrangler secret put
# TURNSTILE_SECRET` once a Turnstile site is created. Until then env.TURNSTILE_SECRET is
# undefined and every submission uses the honeypot+timing baseline only (worker/lib/antispam.ts),
# which is a hard requirement (BUILD-PLAN.md §9: "every page renders correctly with JS
# disabled") — Turnstile is additive, never a hard gate. See README.md "Secrets".
