name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci
      - run: npx astro check
      - run: npm run build
      # BUILD-PLAN.md §8 (WP8): fail the build if any route exceeds 600 KB / 35 requests, so
      # the site can't silently drift back toward the 4.2 MB live WordPress baseline (§1).
      - run: npm run check:budget
      # REMEDIATION-PLAN.md PR 2: fail the build if any internal link points at a route with no
      # corresponding file in dist/.
      - run: npm run check:links
